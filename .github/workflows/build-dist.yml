name: Build dist branch
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml

      - name: Install
        working-directory: js
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: js
        run: pnpm exec tsc -b

      - name: Stage dist tree
        id: stage
        working-directory: js
        env:
          REPO: ${{ github.repository }}
          DIST_BRANCH: dist
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/dist-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"

          PKGS=(pyrmts pyrmts-cfw pyrmts-geo)

          # Pack each package via `pnpm pack` (resolves workspace:* to literal
          # versions in the tarball's package.json) and extract under
          # $STAGE/js/packages/<pkg>/ preserving the source layout.
          for pkg in "${PKGS[@]}"; do
            pack_tmp="$RUNNER_TEMP/pack-$pkg"
            rm -rf "$pack_tmp" && mkdir -p "$pack_tmp"
            ( cd "packages/$pkg" && pnpm pack --pack-destination "$pack_tmp" > /dev/null )
            tgz=$(ls -t "$pack_tmp"/*.tgz | head -1)
            extract="$STAGE/js/packages/$pkg"
            mkdir -p "$extract"
            tar -xzf "$tgz" -C "$extract" --strip-components=1
            rm -rf "$pack_tmp"
          done

          # Rewrite cross-package workspace deps back to GH `&path:` subdir
          # refs (pnpm pack rewrote them to literal `"0.0.0"`, which wouldn't
          # resolve at consumer install time since these packages aren't on
          # npm). The ref points at the `dist` branch by name — consumer
          # lockfiles pin the resolved SHA, so the only race window is on
          # initial install.
          for pkg in "${PKGS[@]}"; do
            src_pkg_json="packages/$pkg/package.json"
            ext_pkg_json="$STAGE/js/packages/$pkg/package.json"
            workspace_deps=$(jq -r '.dependencies // {} | to_entries[] | select(.value == "workspace:*") | .key' "$src_pkg_json")
            for dep in $workspace_deps; do
              ref="https://github.com/$REPO#$DIST_BRANCH&path:/js/packages/$dep"
              jq --arg dep "$dep" --arg ref "$ref" '.dependencies[$dep] = $ref' "$ext_pkg_json" > "$ext_pkg_json.tmp"
              mv "$ext_pkg_json.tmp" "$ext_pkg_json"
            done
          done

          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Push to dist branch
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
          DIST_BRANCH: dist
          SOURCE_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SHORT_SHA="${SOURCE_SHA:0:7}"
          WORK="$RUNNER_TEMP/dist-work"
          rm -rf "$WORK"

          # Worktree-based: doesn't disturb the main checkout's node_modules /
          # build artifacts. `--orphan` on first run, else fetch + check out.
          if git fetch origin "$DIST_BRANCH":"refs/remotes/origin/$DIST_BRANCH" 2>/dev/null; then
            git worktree add "$WORK" "origin/$DIST_BRANCH"
            ( cd "$WORK" && git checkout -B "$DIST_BRANCH" )
            HAS_PARENT=1
          else
            git worktree add --orphan -b "$DIST_BRANCH" "$WORK"
            HAS_PARENT=0
          fi

          cd "$WORK"
          # Wipe the tracked tree, then copy the staged content (including
          # hidden files, hence `/.` rather than `/*`).
          git rm -rf . > /dev/null 2>&1 || true
          cp -r "$STAGE"/. .

          # Root package.json marks this as the dist branch (not itself an
          # installable package — consumers reach into js/packages/<pkg>/).
          cat > package.json <<EOF
          {
            "name": "pyrmts-dist",
            "private": true,
            "description": "Built dist branch for pyrmts packages. See js/packages/*/package.json.",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/$REPO.git"
            }
          }
          EOF

          git add js package.json
          if git diff --cached --quiet; then
            echo "No changes to dist branch"
            exit 0
          fi

          MSG="dist: pyrmts + pyrmts-cfw + pyrmts-geo @ $SHORT_SHA"
          TREE=$(git write-tree)
          if [ "$HAS_PARENT" = "1" ]; then
            DIST_TIP=$(git rev-parse HEAD)
            COMMIT=$(git commit-tree "$TREE" -p "$DIST_TIP" -p "$SOURCE_SHA" -m "$MSG")
          else
            COMMIT=$(git commit-tree "$TREE" -p "$SOURCE_SHA" -m "$MSG")
          fi
          git update-ref "refs/heads/$DIST_BRANCH" "$COMMIT"
          git push origin "$DIST_BRANCH"

          echo "Pushed dist SHA: $COMMIT"
          echo "## Dist branch updated" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`json" >> "$GITHUB_STEP_SUMMARY"
          echo "\"pyrmts\": \"https://github.com/$REPO#$COMMIT&path:/js/packages/pyrmts\"," >> "$GITHUB_STEP_SUMMARY"
          echo "\"pyrmts-cfw\": \"https://github.com/$REPO#$COMMIT&path:/js/packages/pyrmts-cfw\"," >> "$GITHUB_STEP_SUMMARY"
          echo "\"pyrmts-geo\": \"https://github.com/$REPO#$COMMIT&path:/js/packages/pyrmts-geo\"" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
