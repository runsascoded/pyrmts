[project]
name = "pyrmts"
version = "0.0.0"
description = "Multi-scale timeseries pyramids — build side, CLI, core types."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ryan Williams", email = "ryan@runsascoded.com" }]
dependencies = [
    # A RANGE, not a pin: a consumer's own byte-reproducibility pin decides
    # its pyarrow (crashes is on 21, ctbk on 22), and the core works on
    # both — CI runs the core suite on each end. The exact pin lives where
    # reproducibility is load-bearing: `pyrmts-engine` (the Batch image).
    "pyarrow>=21,<23",
    "pyyaml>=6",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
test = [
    "pytest>=8",
    "boto3>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrmts"]
