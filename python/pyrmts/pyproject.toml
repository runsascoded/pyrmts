[project]
name = "pyrmts"
version = "0.0.0"
description = "Multi-scale timeseries pyramids — build side, CLI, core types."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ryan Williams", email = "ryan@runsascoded.com" }]
dependencies = []

[project.scripts]
pyrmts = "pyrmts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrmts"]
