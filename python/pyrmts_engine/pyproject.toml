[project]
name = "pyrmts-engine"
version = "0.0.0"
description = "Fused long-form pyramid build engine — windowed streaming local executor over polars."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ryan Williams", email = "ryan@runsascoded.com" }]
dependencies = [
    "pyrmts",
    "polars>=1.0",
    "click>=8",
]

[project.scripts]
pyrmts-engine = "pyrmts_engine.cli:cli"

[project.optional-dependencies]
batch = ["boto3>=1.34"]
test = ["pytest>=8"]

[tool.uv.sources]
pyrmts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrmts_engine"]
