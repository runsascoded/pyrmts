[project]
name = "pyrmts-engine"
version = "0.0.0"
description = "Fused long-form pyramid build engine — windowed streaming local executor over polars."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ryan Williams", email = "ryan@runsascoded.com" }]
dependencies = [
    "pyrmts",
    # PINNED, not floored: the Batch image installs this unpinned, so an
    # unfloored spec let each rebuild resolve whatever polars was newest —
    # local tests then ran a different polars than prod. That drift shipped
    # a crash (ctbk smg-v1 2026-09-08: `unpivot(value_name=…)` naming an
    # `on` column, tolerated by 1.41, `DuplicateError` on 1.44). Bump this
    # deliberately and re-validate the image, never incidentally.
    "polars==1.44.1",
    "click>=8",
]

[project.scripts]
pyrmts-engine = "pyrmts_engine.cli:cli"

[project.optional-dependencies]
batch = ["boto3>=1.34"]
test = ["pytest>=8"]

[tool.uv.sources]
pyrmts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrmts_engine"]
