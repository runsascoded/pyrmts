[project]
name = "pyrmts-geo"
version = "0.0.0"
description = "Spatial extension for pyrmts — H3/geohash/S2 indexing on top of the time pyramid."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ryan Williams", email = "ryan@runsascoded.com" }]
dependencies = ["pyrmts"]

[tool.uv.sources]
pyrmts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrmts_geo"]
