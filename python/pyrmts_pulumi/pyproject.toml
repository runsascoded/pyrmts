[project]
name = "pyrmts-pulumi"
version = "0.0.0"
description = "Pulumi ComponentResources for standing up the cloud resources a pyrmts pyramid needs."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ryan Williams", email = "ryan@runsascoded.com" }]
dependencies = [
    "pyrmts",
    "pyrmts-engine",
    "pulumi>=3.100,<4",
]

[project.optional-dependencies]
aws = ["pulumi-aws>=7,<8"]
cloudflare = ["pulumi-cloudflare>=6,<7"]
test = ["pytest>=8", "pulumi-aws>=7,<8", "pulumi-cloudflare>=6,<7"]

[tool.uv.sources]
pyrmts = { workspace = true }
pyrmts-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrmts_pulumi"]
